<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password - CoreEfx AI Health Advisor</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/brain.png') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --accent-color: #008000; --background-light: #ffffff; --text-dark: #343a40; --border-color: #e2e6ea; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .main-content { background: var(--background-light); padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 350px; text-align: center; }
        .input-feed-icon { display: flex; align-items: center; background: #f0f2f5; border-radius: 50px; padding: 5px 15px; margin: 15px 0; border: 1px solid var(--border-color); }
        .chat-btn { justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background-color: var(--accent-color); /* Uses your green: #008000 */
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease; /* Smooth transition for hover */
            box-shadow: 0 4px 15px rgba(0, 128, 0, 0.2); /* Soft shadow */}
    </style>
</head>
<body>
    <div class="main-content">
        <i class="fa-solid fa-key" style="font-size: 2.5rem; color: var(--accent-color); margin-bottom: 15px;"></i>
        <h3>New Password</h3>
        <p style="color:#777; font-size: 0.9rem;">Type your new password below.</p>
        <form method="POST">
            <div class="input-feed-icon">
                <input type="password" name="password" placeholder="Enter New Password" required 
                       style="flex:1; background:transparent; border:none; padding:10px; outline:none;">
            </div>
            <button type="submit" class="chat-btn">Update Password</button>
        </form>
    </div>
</body>
</html>
