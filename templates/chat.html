<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1a1a1b" media="(prefers-color-scheme: dark)">
    <title>CoreEfx AI Health Advisor</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/brain.png') }}">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --accent-color: #008000;
            --hover-accent: #28a428;
            --background-light: #f8f9fa;
            --background-white: #ffffff;
            --text-dark: #343a40;
            --text-muted: #6c757d;
            --border-color: #e2e6ea;
            --shadow-light: rgba(0, 0, 0, 0.08);
            --transition-speed: 0.5s;
            --sidebar-width: 0px; /* Default for mobile */
            --header-light:rgba(255, 255, 255, 0.9);
        }
        

        body.dark-mode {
            --primary-color: #6aabff;
            --secondary-color: #a0a8b1;
            --accent-color: #38b45a;
            --hover-accent: #2e8b43;
            --background-light: #2c2f33;
            --background-white: #1a1a1b;
            --text-dark: #e0e0e0;
            --text-muted: #b0b0b0;
            --border-color: #4a4d52;
            --shadow-light: rgba(0, 0, 0, 0.3);
            --header-light:rgba(26, 26, 27, 0.9);
        }
        

        html, body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            position: fixed; 
            width: 100%;
            display: flex;
            overflow-y: hidden;
            flex-direction: column;
            background-color: var(--background-white);
            color: var(--text-dark);
            transition: background-color var(--transition-speed);
            -webkit-overflow-scrolling: touch;
        }

        /* --- SHARED SIDEBAR FROM HOME --- */
        .desktop-sidebar {
            display: none;
            position: fixed;
            left: 0; top: 0;
            height: 100vh;
            overflow-y: auto;
            width: 260px;
            background-color: var(--background-light);
            border-right: 1px solid var(--border-color);
            flex-direction: column;
            padding: 30px 20px;
            z-index: 2000;
        }

        .sidebar-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon { color: var(--accent-color); }
        body.dark-mode .icon { color: var(--text-dark); }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .side-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            text-decoration: none;
            color: var(--text-dark);
            border-radius: 10px;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            font-size: 1rem;
            text-align: left;
        }

        .side-link:hover, .side-link.active {
            background-color: var(--accent-color);
            color: white;
        }

        /* --- CONTENT ALIGNMENT FIX --- */
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 70px 20px 100px 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        /* --- MOBILE NAV --- */
        .app-header {
           display: flex;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            backdrop-filter: blur(12px) saturate(180%) !important;
            -webkit-backdrop-filter: blur(12px) saturate(180%);
            justify-content: space-between;
            align-items: center;
            background-color: var(--header-light);
            padding: 0 20px;
            border-bottom: 0.3px  var(--border-color);
            z-index: 3000;
        }

        /* --- CHAT AREA --- */
        .chat-area { display: flex; flex-direction: column; gap: 15px; width: 100%;}

        .reply-me, .intro-welcome, .input-sympt, .typing-indicator {
            align-self: flex-start;
            background-color: var(--background-light);
            /* Reduced top padding to 6px to remove top space */
            padding: 6px 16px 10px 16px; 
            border-radius: 0 20px 20px 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-width: 75%;
            box-shadow: 0 2px 4px var(--shadow-light);
            animation: fadeIn 0.3s ease;
            margin-top: 0;
            display: flex;
            flex-direction: column; /* Stack text on top of time */
        }

        .input-sympt {
            align-self: flex-end;
            background-color: var(--accent-color);
            color: white;
            border-radius: 20px 20px 0 20px;
        }

        /* The Time Stamp Style */
        .timestamp {
            font-size: 0.65rem;
            opacity: 0.5;
            margin-top: 4px;
            align-self: flex-end; /* Pushes time to the bottom right */
            font-family: 'Inter', sans-serif;
        }

        .input-sympt .timestamp {
            color: #e0e0e0; /* Make time visible on the green background */
        }

        /* Keep the typing dots horizontal */
        .typing-indicator {
            display: flex !important;
            flex-direction: row !important;
            align-items: center;
            gap: 5px;
            padding: 15px !important;
        }

        /* --- STICKY INPUT BAR --- */
        .chat-input-fixed {
           position: fixed;
            bottom: 0;
            left: var(--sidebar-width);
            right: 0;
            background: var(--background-white);
            padding: 10px 20px;
            padding-bottom: calc(10px + env(safe-area-inset-bottom));
            z-index: 4000;
            border-top: 1px solid transparent;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            max-width: 900px;
            margin: 0 auto;
        }

        .symptom-input {
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            flex-grow: 1;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            background: var(--background-light);
            color: var(--text-dark);
            resize: none;
            max-height: 120px;
            font-size: 1rem;
            outline: none;
        }


        .triage-options {
            display: flex;
            flex-direction: column;
            align-items: flex-start; 
            gap: 8px;
            margin-top: 5px;
        }

        .triage-options button {
            max-width: 75%; 
            padding: 10px 16px;
            border: 1px solid var(--accent-color);
            border-radius: 12px;
            background: transparent;
            color: var(--accent-color);
            cursor: pointer;
            transition: 0.2s;
            font-weight: 600;
            font-size: 0.9rem;
            
            /* These properties ensure the button shrinks to fit its text */
            width: fit-content;
            text-align: left;
        }

        .triage-options button:hover {
            background: var(--accent-color);
            color: white;
        }


         #custom-audio-controls {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            background: var(--background-light);
            border-radius: 30px;
            box-shadow: 0 2px 5px var(--shadow-light);
            margin: 10px 20px;
        }

        #progress-bar {
            flex-grow: 1;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .icon_i{

            color: var(--text-dark);
        }

        





        .circle-btn, .mic-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: none;
            background: var(--accent-color);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        #mapid { height: 350px; width: 100%; border-radius: 12px; margin-top: 15px; }


        @media (min-width: 700px) {
            :root { --sidebar-width: 300px; }
            .desktop-sidebar { display: flex; }
            .app-header { display: none; }
            .main-content { padding: 40px 60px 140px 60px; margin-left: var(--sidebar-width); }
        }

        /* Navbar ellipsis menu for mobile settings */
        .nav-menu { position: absolute; top: 50px; right: 20px; background: var(--background-light); display: none; flex-direction: column; padding: 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .nav-menu.show { display: flex; }
        .nav-menu a, .nav-menu button { padding: 10px; text-decoration: none; color: var(--text-dark); border: none; background: none; cursor: pointer; text-align: left; }


        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .typing-dot { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; display: inline-block; animation: bounce 1.3s infinite; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body id="body">

    <aside class="desktop-sidebar">
        <div class="sidebar-logo">
            <i class="fa-solid fa-circle-user icon"></i>
             {{ current_user.username }}
            <span style="font-size: 11px; opacity: 0.7;"><i>CoreEfx AI</i></span> 
        </div>
        <nav class="sidebar-nav">
            <a href="{{ url_for('home') }}" class="side-link">
                <i class="fas fa-home"></i> Home
            </a>
            <hr style="width:100%; border:0; border-top:1px solid var(--border-color); margin: 20px 0;">
            <a href="/privacy_policy" class="side-link"><i class="fas fa-lock"></i> Privacy Policy</a>
            <a href="/terms_of_service" class="side-link"><i class="fas fa-file-alt"></i> Terms of Service</a>
            <button class="side-link" onclick="setTheme('light')"><i class="fa fa-sun"></i> Light Mode</button>
            <button class="side-link" onclick="setTheme('dark')"><i class="fa fa-moon"></i> Dark Mode</button>
            <button class="side-link" onclick="setSystemMode()"><i class="fa fa-desktop"></i> System Mode</button>
            <button class="side-link" onclick="window.location='{{ url_for('logout') }}'">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </nav>
    </aside>

    
    <header class="app-header">
        <div style="display: flex; align-items: center; gap: 10px; padding: 10px 1px;"><h2>
            <div style="display: flex; flex-direction: column;">
                <span style="font-weight: 600; font-size: 22px;"><a href="{{ url_for('home') }}"><i class="fa-solid fa-angle-left icon_i"></i></a>
                &nbsp;<i class="fa-solid fa-circle-user icon"></i> {{ current_user.username }}</span>
                <span style="font-size: 10px; opacity: 0.6;"><i>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;CoreEfx AI</i></span>
            </div>  
        </div>

    
        <button id="navToggle" style="background:none; border:none; font-size: 1.5rem; color: var(--text-dark); cursor: pointer; padding: 5px 10px;">
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </button>

        <div class="nav-menu" id="navMenu">
            <div style="padding: 10px 15px; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border-color); letter-spacing: 1px;">
                Settings
            </div>

           <button onclick="setTheme('light')"><i class="fa fa-sun"></i> Light</button>
           <button onclick="setTheme('dark')"><i class="fa fa-moon"></i> Dark</button>
           <button onclick="setSystemMode()"><i class="fa fa-desktop"></i> System</button>    
            
            <a href="/privacy_policy" style="font-size: small;">
                <i class="fa fa-lock"></i> Privacy Policy
            </a>
            
            <a href="/terms_of_service" style="font-size: small;">
                <i class="fa fa-file-alt"></i> Terms of Service
            </a>

            
            <button onclick="window.location='{{ url_for('logout') }}'" style="font-weight: 600; padding: 12px 30px;">
                <i class="fa fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </header>

    <main class="main-content">
        
        <div id="location-status" style="font-size: 0.8rem; text-align: center; color: var(--text-muted); margin-bottom: 20px;">
            Initializing sensors...
        </div>

        <div class="chat-area" id="chatArea">
            </div>

        <section id="results-extra" style="margin-top: 20px;">
            <div id="custom-audio-controls" style="display:none; align-items: center; gap: 12px; padding: 15px; background: var(--background-light); border-radius: 30px; margin-bottom: 20px;">
                <button id="play-pause-btn" style="background:none; border:none; color:var(--accent-color); font-size:1.5rem;"><i class="fas fa-play"></i></button>
                <input type="range" id="progress-bar" value="0" style="flex-grow:1;">
                <span id="time-display" style="font-size: 0.8rem;">0:00 / 0:00</span>
                <audio id="adviceAudio"></audio>
            </div>

            <div id="hospital-map-section" style="display:none;">
                <div id="hospital-list-container"></div>
                <div id="mapid"></div>
            </div>
        </section>
    </main>

    <div class="chat-input-fixed">
        <div class="input-container">
            <textarea id="symptoms" rows="1" placeholder="Describe symptoms..." class="symptom-input"></textarea>
            <button class="mic-btn" onclick="startDictation()"><i class="fa-solid fa-microphone"></i></button>
            <button class="circle-btn" onclick="handleSend()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <input type="hidden" id="lat" value="0.0">
    <input type="hidden" id="lon" value="0.0">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        const chatArea = document.getElementById('chatArea');
        const symptomInput = document.getElementById('symptoms');
        const mainContent = document.querySelector('.main-content');
        const inputFixedBar = document.querySelector('.chat-input-fixed');
        let triageStep = 0;
        let isProcessing = false; 
        let storedSymptoms = "";
        let triageAnswers = { patient: null, gender: null, age: null, severity: null, notice_self: null, last_diagnosed: null, notice_others: null };
        

        const triageQuestions = [
            { id: "patient", q: "Who is this for?", opt: [{l:"Myself", v:"self"}, {l:"Someone else", v:"someone"}] },
            { id: "gender", q: "What is the gender?", opt: [{l:"Male", v:"male"}, {l:"Female", v:"female"}] },
            { id: "age", q: "What is the age group?", opt: [] },
            { id: "severity", q: "How severe is the symptom?", opt: [{l:"Low", v:"low"}, {l:"Moderate", v:"moderate"}, {l:"High", v:"high"}] },
            { id: "notice_self", q: "When did you notice this?", opt: [{l:"Recently", v:"recently"}, {l:"Long ago", v:"long ago"}], condition: "self" },
            { id: "last_diagnosed", q: "When did you last go for a check up?", opt: [{l:"Never", v:"never"}, {l:"Months ago", v:"months ago"}, {l:"Years ago", v:"years ago"}], condition: "self" },
            { id: "notice_others", q: "When was this noticed?", opt: [{l:"Recently", v:"recently"}, {l:"Long ago", v:"long ago"}], condition: "someone" }
        ];

        const AGE_OPTIONS_SELF = [
            {l:"18-29 ", v:"young adult"}, 
            {l:"30-44 ", v:"middle adult"}, 
            {l:"45-59", v:"mature adult"}, 
            {l:"60+", v:"elderly"}
        ];

        const AGE_OPTIONS_OTHERS = [
            {l:"Under 18", v:"minor"},
            ...AGE_OPTIONS_SELF
        ];

        /*Theme logic (light, dark, and system)*/
        const systemQuery = window.matchMedia('(prefers-color-scheme: dark)');

        /**
         * Directly applies the dark-mode class to the body
         */
        function applyTheme(mode) {
            const navMenu = document.getElementById('navMenu');
            if (navMenu) navMenu.classList.remove('show'); // Auto-close menu

            if (mode === 'dark') {
                document.body.classList.add('dark-mode');
            } else if (mode === 'light') {
                document.body.classList.remove('dark-mode');
            } else if (mode === 'system') {
                if (systemQuery.matches) {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }
            }
        }

        /**
         * Sets a specific mode and stops listening to system changes
         */
        function setTheme(mode) {
            localStorage.setItem('theme', mode);
            applyTheme(mode);
            systemQuery.removeEventListener('change', handleSystemChange);
        }

        /**
         * Sets mode to system and starts listening for OS changes
         */
        function setSystemMode() {
            localStorage.setItem('theme', 'system');
            applyTheme('system');
            systemQuery.addEventListener('change', handleSystemChange);
        }

        /**
         * Callback for the system color scheme listener
         */
        function handleSystemChange() {
            if (localStorage.getItem('theme') === 'system') {
                applyTheme('system');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initLocation();
            initTheme();
            appendMessage("<b>What symptoms are you experiencing today?</b>", 'reply-me');

            // --- KEYBOARD & VIEWPORT LOGIC ---
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => {
                    const offset = window.innerHeight - window.visualViewport.height;
                    if (offset > 0) {
                        inputFixedBar.style.bottom = `${offset}px`;
                        setTimeout(() => { mainContent.scrollTop = mainContent.scrollHeight; }, 100);
                    } else {
                        inputFixedBar.style.bottom = '0px';
                    }
                    window.scrollTo(0, 0);
                });
            }

            symptomInput.addEventListener('focus', () => {
                setTimeout(() => { window.scrollTo(0, 0); document.body.scrollTop = 0; }, 50);
            });

            symptomInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            symptomInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
            });

            function initTheme() {
            const saved = localStorage.getItem('theme') || 'system';
            if (saved === 'system') {
                setSystemMode();
            } else {
                applyTheme(saved);
            }
        }
        });

        // ✅ AUTOMATIC REFRESH: Clears everything for a new session
        function clearPreviousSession() {
            chatArea.innerHTML = '';
            document.getElementById('hospital-map-section').style.display = 'none';
            document.getElementById('custom-audio-controls').style.display = 'none';
            const audio = document.getElementById('adviceAudio');
            audio.pause();
            audio.src = '';
            triageStep = 0;
            isProcessing = false;
            triageAnswers = { patient: null, gender: null, age: null, severity: null, diagnosis: null };
        }

        function handleSend() {
            const text = symptomInput.value.trim();
            if (!text || isProcessing) return;

            if (chatArea.children.length > 0 && triageStep === 0) {
                chatArea.innerHTML = '';
                document.getElementById('hospital-map-section').style.display = 'none';
                document.getElementById('custom-audio-controls').style.display = 'none';
            }

            isProcessing = true;
            storedSymptoms = text;
            appendMessage(`<b>${text}</b>`, 'input-sympt');
            symptomInput.value = "";
            symptomInput.style.height = 'auto';
            symptomInput.disabled = true;

            askTriage();
        }

        function askTriage() {
            if (triageStep >= triageQuestions.length) {
                submitFinal();
                return;
            }

            const current = triageQuestions[triageStep];
            

            // --- LOGIC: SKIP QUESTIONS BASED ON CONDITION ---
            if (current.condition && triageAnswers.patient !== current.condition) {
                triageStep++;
                askTriage();
                return;
            }

            // --- DYNAMIC AGE LOGIC START ---
            if (current.id === "age") {
                if (triageAnswers.patient === "self") {
                    current.opt = AGE_OPTIONS_SELF;
                } else {
                    current.opt = AGE_OPTIONS_OTHERS;
                }
            }

            showTyping();

            setTimeout(() => {
                removeTyping();
                appendMessage(`<b>${current.q}</b>`, 'reply-me');
                
                const optContainer = document.createElement('div');
                optContainer.className = 'triage-options';
                current.opt.forEach(o => {
                    const btn = document.createElement('button');
                    btn.innerText = o.l;
                    btn.onclick = () => {
                        triageAnswers[current.id] = o.v;
                        optContainer.remove();
                        appendMessage(`<b>${o.l}</b>`, 'input-sympt');
                        triageStep++;
                        askTriage();
                    };
                    optContainer.appendChild(btn);
                });
                chatArea.appendChild(optContainer);
                mainContent.scrollTop = mainContent.scrollHeight;
            }, 1000);
        }


        function submitFinal() {
            showTyping();
            const payload = {
                symptoms: storedSymptoms,
                ...triageAnswers,
                lat: document.getElementById('lat').value,
                lon: document.getElementById('lon').value
            };

            fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                removeTyping();
                symptomInput.disabled = false;
                isProcessing = false; 
                triageStep = 0; 
                
                if (data.result) appendMessage(`<b>${data.result.join('<br><br>')}</b>`, 'reply-me');
                if (data.audio_file) setupAudio(data.audio_file);
                if (data.hospitals) setupHospitals(data.hospitals, data.severity);
            })
            .catch(err => {
                removeTyping();
                appendMessage("<b>Connection error.</b>", 'reply-me');
                symptomInput.disabled = false;
                isProcessing = false;
            });
        }

        function setupAudio(url) {
            const audio = document.getElementById('adviceAudio');
            const controls = document.getElementById('custom-audio-controls');
            const playBtn = document.getElementById('play-pause-btn');
            const progress = document.getElementById('progress-bar');
            const timeDisp = document.getElementById('time-display');

            audio.src = url;
            controls.style.display = 'flex';

            audio.onloadedmetadata = () => {
                progress.max = Math.floor(audio.duration);
                timeDisp.innerText = `0:00 / ${formatTime(audio.duration)}`;
            };

            audio.ontimeupdate = () => {
                progress.value = Math.floor(audio.currentTime);
                timeDisp.innerText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
            };

            playBtn.onclick = () => {
                if (audio.paused) {
                    audio.play();
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                } else {
                    audio.pause();
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                }
            };
        }

        // ✅ IMPROVED HOSPITAL DESIGN: Links, Phone, and UI
        function setupHospitals(hospitals, severity) {
            const container = document.getElementById('hospital-map-section');
            const list = document.getElementById('hospital-list-container');
            
            if (!hospitals || hospitals.length === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            let html = `<h4 style="margin-bottom:15px;">${severity === 'high' ? '🚨 Emergency Facilities Plus Hospitals Near You, Hurry And Go To One Of Them Before It Is to Late' : 'Just Incase, These Are Nearby Hospitals Around You'}:</h4>`;
            
            hospitals.forEach(h => {
                html += `
                    <div style="background: var(--background-light); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--accent-color);">
                        <div style="font-weight: bold; font-size: 1.1rem;">${h.name}</div>
                        <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">
                            <i class="bi bi-geo-alt"></i> ${h.city} • <strong>${h.distance} away</strong>
                        </div>
                        
                        <div style="font-size: 0.85rem; margin-bottom: 10px; color: var(--text-dark);">
                            <i class="bi bi-clock-history"></i> Estimated Travel Time: <strong>${h.travel_time}</strong>
                        </div>

                        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                            <a href="tel:${h.phone}" style="text-decoration:none; color:var(--accent-color); font-weight:600; font-size:0.9rem;">
                                <i class="bi bi-telephone-fill"></i> ${h.phone || 'Call'}
                            </a>
                            <a href="${h.url}" target="_blank" style="text-decoration:none; color:var(--primary-color); font-weight:600; font-size:0.9rem;">
                                <i class="bi bi-info-circle-fill"></i> Website
                            </a>
                            <a href="${h.maps_link}" target="_blank" style="text-decoration:none; color:#db4437; font-weight:600; font-size:0.9rem;">
                                <i class="bi bi-map-fill"></i> Google Map
                            </a>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;
            initMap(hospitals);
        }

        // ✅ IMPROVED MAP: Loops through hospitals and adds markers
        function initMap(hospitals) {
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);
            
            if (map) map.remove();
            map = L.map('mapid').setView([lat, lon], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // User marker
            L.marker([lat, lon]).addTo(map).bindPopup("<b>You are here</b>").openPopup();

            // Hospital markers
            hospitals.forEach(h => {
                if (h.lat && h.lon) {
                    L.marker([h.lat, h.lon]).addTo(map).bindPopup(`<b>${h.name}</b><br>${h.city}`);
                }
            });
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function startDictation() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                return alert("Speech recognition is not supported in this browser. Please try Google Chrome.");
            }

            const rec = new SpeechRecognition();
            rec.lang = 'en-US'; // Set the language

            rec.onstart = () => {
                console.log("Voice recognition started. Speak into the microphone.");
            };

            rec.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                document.getElementById('symptoms').value = transcript;
            };

            rec.onerror = (e) => {
                console.error("Speech recognition error:", e.error);
                alert("Error occurred in recognition: " + e.error);
            };

            rec.start();
        }

        function appendMessage(content, className) {
            const div = document.createElement('div');
            div.className = className;
            
            // Create the time
            const now = new Date();
            const timeStr = now.getHours().toString().padStart(2, '0') + ':' + 
                            now.getMinutes().toString().padStart(2, '0');

            // Put the content and time together
            div.innerHTML = `
                <div style="display: flex; flex-direction: column; width: 100%;">
                    <div style="margin: 0; padding: 0;">${content}</div>
                    <span class="timestamp">${timeStr}</span>
                </div>
            `;

            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typingIndicator';
            div.innerHTML = '<span class="typing-dot"></span> <span class="typing-dot"></span> <span class="typing-dot"></span>';
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function removeTyping() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function initLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        document.getElementById('lat').value = pos.coords.latitude;
                        document.getElementById('lon').value = pos.coords.longitude;
                        const status = document.getElementById('location-status');
                        if (status) status.remove();
                    },
                    err => { 
                        const status = document.getElementById('location-status');
                        if (status) status.innerText = "⚠️ Location services disabled";
                    }
                );
            }
        }

        document.getElementById('navToggle').addEventListener('click', () => {
            document.getElementById('navMenu').classList.toggle('show');
        });
    </script>

</body>
</html>
