<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>CoreEfx AI Chat</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/brain.png') }}">
    
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        :root {
            --primary-color: #007bff;
            --secondary-color: #6c757d;
            --accent-color: #008000;
            --hover-accent: #28a428;
            --background-light: #f8f9fa;
            --background-white: #ffffff;
            --text-dark: #343a40;
            --text-muted: #6c757d;
            --border-color: #e2e6ea;
            --shadow-light: rgba(0, 0, 0, 0.08);
            --transition-speed: 0.5s;
            --sidebar-width: 0px; /* Default for mobile */
        }

        body.dark-mode {
            --primary-color: #6aabff;
            --secondary-color: #a0a8b1;
            --accent-color: #38b45a;
            --hover-accent: #2e8b43;
            --background-light: #2c2f33;
            --background-white: #36393f;
            --text-dark: #e0e0e0;
            --text-muted: #b0b0b0;
            --border-color: #4a4d52;
            --shadow-light: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            background-color: var(--background-white);
            color: var(--text-dark);
            transition: background-color var(--transition-speed);
        }

        /* --- SHARED SIDEBAR FROM HOME --- */
        .desktop-sidebar {
            display: none;
            position: fixed;
            left: 0; top: 0;
            height: 100vh;
            overflow-y: auto;
            width: 260px;
            background-color: var(--background-light);
            border-right: 1px solid var(--border-color);
            flex-direction: column;
            padding: 30px 20px;
            z-index: 2000;
        }

        .sidebar-logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .icon { color: var(--accent-color); }
        body.dark-mode .icon { color: var(--text-dark); }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }

        .side-link {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 12px 15px;
            text-decoration: none;
            color: var(--text-dark);
            border-radius: 10px;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            font-size: 1rem;
            text-align: left;
        }

        .side-link:hover, .side-link.active {
            background-color: var(--accent-color);
            color: white;
        }

        /* --- CONTENT ALIGNMENT FIX --- */
        .main-content {
            margin-left: var(--sidebar-width);
            padding: 80px 20px 140px 20px;
            transition: margin-left 0.3s ease;
            max-width: 900px; /* Centering chat on large screens */
            margin-right: auto;
        }

        /* --- MOBILE NAV --- */
        .app-header {
           display: flex;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 60px;
            justify-content: space-between;
            align-items: center;
            background-color: var(--background-white);
            padding: 0 20px;
            border-bottom: 1px solid var(--border-color);
            z-index: 3000;
        }

        /* --- CHAT AREA --- */
        .chat-area { display: flex; flex-direction: column; gap: 15px; }

        .reply-me, .intro-welcome, .typing-indicator {
            align-self: flex-start;
            background-color: var(--background-light);
            padding: 12px 16px;
            border-radius: 0 20px 20px 20px;
            max-width: 75%;
            box-shadow: 0 2px 4px var(--shadow-light);
            animation: fadeIn 0.3s ease;
        }


        .input-sympt {
            align-self: flex-end;
            background-color: var(--accent-color);
            color: white;
            padding: 12px 16px;
            border-radius: 20px 20px 0 20px;
            max-width: 80%;
        }

        /* --- STICKY INPUT BAR --- */
        .chat-input-fixed {
            position: fixed;
            bottom: 0;
            left: var(--sidebar-width);
            right: 0;
            background: var(--background-white);
            padding: 15px 20px;
            border-top: 1px solid transparent;
            z-index: 1000;
            transition: left 0.3s ease;
        }

        .input-container {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            max-width: 900px;
            margin: 0 auto;
        }

        .symptom-input {
            flex-grow: 1;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 25px;
            background: var(--background-light);
            color: var(--text-dark);
            resize: none;
            max-height: 120px;
            font-size: 1rem;
            outline: none;
        }


        .triage-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 5px;
        }

        .triage-options button {
            padding: 10px;
            border: 1px solid var(--accent-color);
            border-radius: 8px;
            background: transparent;
            color: var(--accent-color);
            cursor: pointer;
            transition: 0.2s;
        }

        .triage-options button:hover {
            background: var(--accent-color);
            color: white;
        }

         #custom-audio-controls {
            display: none;
            align-items: center;
            gap: 12px;
            padding: 10px 15px;
            background: var(--background-light);
            border-radius: 30px;
            box-shadow: 0 2px 5px var(--shadow-light);
            margin: 10px 20px;
        }

        #progress-bar {
            flex-grow: 1;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .icon_i{

            color: var(--text-dark);
        }

        





        .circle-btn, .mic-btn {
            width: 45px; height: 45px;
            border-radius: 50%;
            border: none;
            background: var(--accent-color);
            color: white;
            font-size: 1rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        #mapid { height: 350px; width: 100%; border-radius: 12px; margin-top: 15px; }

        .nav-menu { position: absolute; top: 50px; right: 20px; background: var(--background-light); display: none; flex-direction: column; padding: 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .nav-menu.show { display: flex; }

        @media (min-width: 700px) {
            :root { --sidebar-width: 300px; }
            .desktop-sidebar { display: flex; }
            .app-header { display: none; }
            .main-content { padding: 40px 60px 140px 60px; margin-left: var(--sidebar-width); }
        }

        /* Navbar ellipsis menu for mobile settings */
        .nav-menu { position: absolute; top: 50px; right: 20px; background: var(--background-light); display: none; flex-direction: column; padding: 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .nav-menu.show { display: flex; }
        .nav-menu a, .nav-menu button { padding: 10px; text-decoration: none; color: var(--text-dark); border: none; background: none; cursor: pointer; text-align: left; }


        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .typing-dot { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; display: inline-block; animation: bounce 1.3s infinite; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    </style>
</head>
<body id="body">

    <aside class="desktop-sidebar">
        <div class="sidebar-logo">
             {{ current_user.username }}
        </div>
        <nav class="sidebar-nav">
            <a href="{{ url_for('home') }}" class="side-link">
                <i class="fas fa-home"></i> Home
            </a>
            <hr style="width:100%; border:0; border-top:1px solid var(--border-color); margin: 20px 0;">
            <a href="/privacy_policy" class="side-link"><i class="fas fa-lock"></i> Privacy Policy</a>
            <a href="/terms_of_service" class="side-link"><i class="fas fa-file-alt"></i> Terms of Service</a>
            <button class="side-link" onclick="toggleTheme()"><i class="fas fa-moon"></i> Appearance</button>
            <button class="side-link" onclick="window.location='{{ url_for('logout') }}'">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
            <div style="font-size: 15px; padding: 15px; color: var(--text-dark); margin-top: auto;">
                <i class="fa-solid fa-circle-user"></i> <b>{{ current_user.username }}</b>
            </div>
        </nav>
    </aside>

    
        <header class="app-header">
            <div class="header-user"><h2>
                <a href="{{ url_for('home') }}"><i class="fa-solid fa-angle-left icon_i"></i></a>
                &nbsp;<i class="fa-solid fa-circle-user icon"></i>
                <span style="font-weight: 540;"><b>{{ current_user.username }}</b></span>
                </h2>
            </div>

        
            <button id="navToggle" style="background:none; border:none; font-size: 1.5rem; color: var(--text-dark); cursor: pointer; padding: 5px 10px;">
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>

            <div class="nav-menu" id="navMenu">
                <div style="padding: 10px 15px; font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid var(--border-color); letter-spacing: 1px;">
                    Settings
                </div>
                
                
                
                <a href="/privacy_policy">
                    <i class="fa fa-lock"></i> Privacy Policy
                </a>
                
                <a href="/terms_of_service">
                    <i class="fa fa-file-alt"></i> Terms of Service
                </a>

                
                <button onclick="window.location='{{ url_for('logout') }}'" style="font-weight: 600; padding: 12px 30px;">
                    <i class="fa fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </header>

    <main class="main-content">
        
        <div id="location-status" style="font-size: 0.8rem; text-align: center; color: var(--text-muted); margin-bottom: 20px;">
            Initializing sensors...
        </div>

        <div class="chat-area" id="chatArea">
            </div>

        <section id="results-extra" style="margin-top: 20px;">
            <div id="custom-audio-controls" style="display:none; align-items: center; gap: 12px; padding: 15px; background: var(--background-light); border-radius: 30px; margin-bottom: 20px;">
                <button id="play-pause-btn" style="background:none; border:none; color:var(--accent-color); font-size:1.5rem;"><i class="fas fa-play"></i></button>
                <input type="range" id="progress-bar" value="0" style="flex-grow:1;">
                <span id="time-display" style="font-size: 0.8rem;">0:00 / 0:00</span>
                <audio id="adviceAudio"></audio>
            </div>

            <div id="hospital-map-section" style="display:none;">
                <div id="hospital-list-container"></div>
                <div id="mapid"></div>
            </div>
        </section>
    </main>

    <div class="chat-input-fixed">
        <div class="input-container">
            <textarea id="symptoms" rows="1" placeholder="Describe symptoms..." class="symptom-input"></textarea>
            <button class="mic-btn" onclick="startDictation()"><i class="fa-solid fa-microphone"></i></button>
            <button class="circle-btn" onclick="handleSend()"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
    </div>

    <input type="hidden" id="lat" value="0.0">
    <input type="hidden" id="lon" value="0.0">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let map;
        const chatArea = document.getElementById('chatArea');
        const symptomInput = document.getElementById('symptoms');
        let triageStep = 0;
        let isProcessing = false; 
        let storedSymptoms = "";
        let triageAnswers = { patient: null, gender: null, age: null, severity: null, diagnosis: null };

        const triageQuestions = [
            { id: "patient", q: "If i may, Who is this for?", opt: [{l:"Myself", v:"self"}, {l:"Someone else", v:"someone"}] },
            { id: "gender", q: "Please What gender?", opt: [{l:"Male", v:"male"}, {l:"Female", v:"female"}] },
            { id: "age", q: "What Age group?", opt: [{l:"0-12", v:"child"}, {l:"13-19", v:"teen"}, {l:"20-59", v:"adult"}, {l:"60+", v:"elderly"}] },
            { id: "severity", q: "what's the Severity level?(How much does it hurt?)", opt: [{l:"Low", v:"low"}, {l:"Moderate", v:"moderate"}, {l:"High", v:"high"}] },
            { id: "diagnosis", q: "When last did you notice this?", opt: [{l:"Never", v:"never"}, {l:"Recently", v:"recent"}, {l:"Long ago", v:"long"}] }
        ];

        document.addEventListener('DOMContentLoaded', () => {
            initLocation();
            initTheme();
            appendMessage("<b>What symptoms are you experiencing today?</b>", 'reply-me');

            symptomInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 150) + 'px';
            });
        });

        // ✅ AUTOMATIC REFRESH: Clears everything for a new session
        function clearPreviousSession() {
            chatArea.innerHTML = '';
            document.getElementById('hospital-map-section').style.display = 'none';
            document.getElementById('custom-audio-controls').style.display = 'none';
            const audio = document.getElementById('adviceAudio');
            audio.pause();
            audio.src = '';
            triageStep = 0;
            isProcessing = false;
            triageAnswers = { patient: null, gender: null, age: null, severity: null, diagnosis: null };
        }

        function handleSend() {
            const text = symptomInput.value.trim();
            if (!text) return;

            // Prevent interruption mid-triage
            if (isProcessing && triageStep > 0) return;

            // ✅ TRIGGER AUTO REFRESH: If chatArea has messages but we're starting a new flow
            if (chatArea.children.length > 0 && triageStep === 0) {
                clearPreviousSession();
            }

            isProcessing = true;
            storedSymptoms = text;
            appendMessage(`<b>${text}</b>`, 'input-sympt');
            symptomInput.value = "";
            symptomInput.style.height = 'auto';
            symptomInput.disabled = true;

            askTriage();
        }

        function askTriage() {
            if (triageStep >= triageQuestions.length) {
                submitFinal();
                return;
            }

            const current = triageQuestions[triageStep];
            showTyping();

            setTimeout(() => {
                removeTyping();
                appendMessage(`<b>${current.q}</b>`, 'reply-me');
                
                const optContainer = document.createElement('div');
                optContainer.className = 'triage-options';
                current.opt.forEach(o => {
                    const btn = document.createElement('button');
                    btn.innerText = o.l;
                    btn.onclick = () => selectTriage(current.id, o.v, o.l, optContainer);
                    optContainer.appendChild(btn);
                });
                chatArea.appendChild(optContainer);
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 800);
        }

        function selectTriage(id, val, label, container) {
            triageAnswers[id] = val;
            container.remove();
            appendMessage(`<b>${label}</b>`, 'input-sympt');
            triageStep++;
            askTriage();
        }

        function submitFinal() {
            showTyping();
            const payload = {
                symptoms: storedSymptoms,
                ...triageAnswers,
                lat: document.getElementById('lat').value,
                lon: document.getElementById('lon').value
            };

            fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                removeTyping();
                symptomInput.disabled = false;
                isProcessing = false; 
                triageStep = 0; 
                
                if (data.result) appendMessage(`<b>${data.result.join('<br><br>')}</b>`, 'reply-me');
                if (data.audio_file) setupAudio(data.audio_file);
                if (data.hospitals) setupHospitals(data.hospitals, data.severity);
            })
            .catch(err => {
                removeTyping();
                appendMessage("<b>Connection error.</b>", 'reply-me');
                symptomInput.disabled = false;
                isProcessing = false;
            });
        }

        function setupAudio(url) {
            const audio = document.getElementById('adviceAudio');
            const controls = document.getElementById('custom-audio-controls');
            const playBtn = document.getElementById('play-pause-btn');
            const progress = document.getElementById('progress-bar');
            const timeDisp = document.getElementById('time-display');

            audio.src = url;
            controls.style.display = 'flex';

            audio.onloadedmetadata = () => {
                progress.max = Math.floor(audio.duration);
                timeDisp.innerText = `0:00 / ${formatTime(audio.duration)}`;
            };

            audio.ontimeupdate = () => {
                progress.value = Math.floor(audio.currentTime);
                timeDisp.innerText = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
            };

            playBtn.onclick = () => {
                if (audio.paused) {
                    audio.play();
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                } else {
                    audio.pause();
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                }
            };
        }

        // ✅ IMPROVED HOSPITAL DESIGN: Links, Phone, and UI
        function setupHospitals(hospitals, severity) {
            const container = document.getElementById('hospital-map-section');
            const list = document.getElementById('hospital-list-container');
            
            if (!hospitals || hospitals.length === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            let html = `<h4 style="margin-bottom:15px;">${severity === 'high' ? '🚨 Emergency Facilities Plus Hospitals Near You, Hurry and choose' : 'Just Incase These Are Nearby Hospitals'}:</h4>`;
            
            hospitals.forEach(h => {
                html += `
                    <div style="background: var(--background-light); padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--accent-color);">
                        <div style="font-weight: bold; font-size: 1.1rem;">${h.name}</div>
                        <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">
                            <i class="bi bi-geo-alt"></i> ${h.city}
                        </div>
                        <div style="display: flex; gap: 15px;">
                            <a href="tel:${h.phone}" style="text-decoration:none; color:var(--accent-color); font-weight:600; font-size:0.9rem;">
                                <i class="bi bi-telephone-fill"></i> ${h.phone || 'Call'}
                            </a>
                            <a href="${h.url}" target="_blank" style="text-decoration:none; color:var(--primary-color); font-weight:600; font-size:0.9rem;">
                                <i class="bi bi-info-circle-fill"></i> Website
                            </a>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;
            initMap(hospitals);
        }

        // ✅ IMPROVED MAP: Loops through hospitals and adds markers
        function initMap(hospitals) {
            const lat = parseFloat(document.getElementById('lat').value);
            const lon = parseFloat(document.getElementById('lon').value);
            
            if (map) map.remove();
            map = L.map('mapid').setView([lat, lon], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // User marker
            L.marker([lat, lon]).addTo(map).bindPopup("<b>You are here</b>").openPopup();

            // Hospital markers
            hospitals.forEach(h => {
                if (h.lat && h.lon) {
                    L.marker([h.lat, h.lon]).addTo(map).bindPopup(`<b>${h.name}</b><br>${h.city}`);
                }
            });
        }

        function formatTime(secs) {
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function startDictation() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                return alert("Speech recognition is not supported in this browser. Please try Google Chrome.");
            }

            const rec = new SpeechRecognition();
            rec.lang = 'en-US'; // Set the language

            rec.onstart = () => {
                console.log("Voice recognition started. Speak into the microphone.");
            };

            rec.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                document.getElementById('symptoms').value = transcript;
            };

            rec.onerror = (e) => {
                console.error("Speech recognition error:", e.error);
                alert("Error occurred in recognition: " + e.error);
            };

            rec.start();
        }

        function appendMessage(content, className) {
            const div = document.createElement('div');
            div.className = className;
            div.innerHTML = content;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function showTyping() {
            const div = document.createElement('div');
            div.className = 'typing-indicator';
            div.id = 'typingIndicator';
            div.innerHTML = '<span class="typing-dot"></span> <span class="typing-dot"></span> <span class="typing-dot"></span>';
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function removeTyping() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function initLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        document.getElementById('lat').value = pos.coords.latitude;
                        document.getElementById('lon').value = pos.coords.longitude;
                        const status = document.getElementById('location-status');
                        if (status) status.remove();
                    },
                    err => { 
                        const status = document.getElementById('location-status');
                        if (status) status.innerText = "⚠️ Location services disabled";
                    }
                );
            }
        }

        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') document.body.classList.add('dark-mode');
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            localStorage.setItem('theme', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
            document.getElementById('navMenu').classList.remove('show');
        }

        document.getElementById('navToggle').addEventListener('click', () => {
            document.getElementById('navMenu').classList.toggle('show');
        });
    </script>

</body>
</html>
